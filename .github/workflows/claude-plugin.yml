name: Claude plugin

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".github/workflows/claude-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @anthropic-ai/claude-code@2.1.309 plugin validate --strict .
